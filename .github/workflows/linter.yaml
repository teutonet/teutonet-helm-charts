name: Lint Helm Charts

on:
  pull_request:
    paths:
      - charts/**
  merge_group:
    types:
      - checks_requested

jobs:
  getChangedCharts:
    uses: ./.github/workflows/get-changed-charts.yaml
    permissions:
      pull-requests: read
      contents: read
    with:
      pr_number: ${{ github.event.pull_request.number || -1 }}
      base_commit: ${{ github.event.merge_group.base_sha || 'missing' }}
      head_commit: ${{ github.event.merge_group.head_sha || 'missing' }}
  lint-helm-chart:
    name: lint helm chart
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - getChangedCharts
    if: ${{ needs.getChangedCharts.outputs.count > 0 }}
    strategy:
      matrix:
        chart: ${{ fromJson(needs.getChangedCharts.outputs.charts) }}
    env:
      CT_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.event.repository.default_branch }}
      CHART: ${{ matrix.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - run: pip install yq
      - name: Install sponge
        run: sudo apt-get -yq install moreutils
      - name: Extract helm repos
        id: helm-repos
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          (
            echo -n "repos="
            yq -r '.dependencies[] | .repository' "charts/$CHART/Chart.yaml" | sort -u | grep https:// | awk '{printf (NR>1 ? "," : "") NR "=" $1}'
            echo
          ) | tee -a "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14

      - name: Build chart dependencies
        run: helm dependency update "charts/$CHART"

      - name: Build test wrapper dependencies
        if: hashFiles(format('charts/{0}/tests/Chart.yaml', env.CHART)) != ''
        run: helm dep build "charts/$CHART/tests"

      - name: Run helm unit tests
        if: hashFiles(format('charts/{0}/tests/**', env.CHART)) != ''
        uses: d3adb5/helm-unittest-action@850bc76597579183998069830d5fa8c3ef0ea34a # v2.5.0
        with:
          helm-version: v3.20.2
          charts: >-
            ${{ hashFiles(format('charts/{0}/tests/Chart.yaml', env.CHART)) != ''
              && format('charts/{0}/tests', env.CHART)
              || format('charts/{0}', env.CHART) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: ./.github/scripts/prepare-values.sh "charts/$CHART"
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Lint chart
        env:
          CT_CHART_REPOS: ${{ steps.helm-repos.outputs.repos }}
          CT_CHARTS: charts/${{ matrix.chart }}
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          if ! [[ -f "charts/$CHART/values.yaml" ]]; then
            echo "No values.yaml found for $CHART, skipping 'ct lint'" >&2
            helm lint "charts/$CHART"
          else
            ct lint --check-version-increment=false
          fi

      - run: ./.github/scripts/templateHelmChartRecursivelyToFolder.sh "charts/$CHART" /tmp/templated
        id: templateChart
      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@366e3d0ebb136f41eadc96ff7a1281d396e1d58b # v5.24.3
        if: ${{ steps.templateChart.outputs.skipped == 'false' }}
      - run: pluto detect-files -d /tmp/templated -o custom --columns 'FILEPATH,NAME,KIND,VERSION,REPLACEMENT,REMOVED,DEPRECATED,REPL AVAIL'
        if: ${{ steps.templateChart.outputs.skipped == 'false' }}
      - name: Install kubescape
        if: ${{ steps.templateChart.outputs.skipped == 'false' && matrix.chart != 'base-cluster' }} # base-cluster just times this step out...
        run: /home/linuxbrew/.linuxbrew/bin/brew install kubescape
      - name: Run kubescape
        if: ${{ steps.templateChart.outputs.skipped == 'false' && matrix.chart != 'base-cluster' }} # base-cluster just times this step out...
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          kubescape_args=(/tmp/templated)
          if [[ -f "charts/$CHART/kubescape-exceptions.json" ]]; then
            kubescape_args+=(--exceptions <(jq -s 'add' .github/kubescape-exceptions.json "charts/$CHART/kubescape-exceptions.json"))
          else
            kubescape_args+=(--exceptions .github/kubescape-exceptions.json)
          fi
          kubescape scan "${kubescape_args[@]}"
