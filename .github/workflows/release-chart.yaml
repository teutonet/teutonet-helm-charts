name: Release Chart

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/release-please/manifest.json

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          skip-github-pull-request: true
          token: ${{ secrets.ACTIONS_BOT_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
  release_helm:
    runs-on: ubuntu-latest
    needs: release_please
    permissions:
      packages: write
      contents: read
      id-token: write
    if: ${{ needs.release_please.outputs.releases_created }}
    strategy:
      matrix:
        chart: ${{ fromJson(needs.release_please.outputs.paths_released) }}
    env:
      CHART: ${{ matrix.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - run: helm package --dependency-update "${CHART}"
      - run: helm registry login ghcr.io --username ${{ github.repository_owner }} --password ${{ github.token }}
      - run: helm push -- *.tgz "oci://ghcr.io/${GITHUB_REPOSITORY}"
      - run: oras login ghcr.io --username ${{ github.repository_owner }} --password ${{ github.token }}
      - name: Sign chart
        run: |
          version="$(yq -r '.version' "${CHART}/Chart.yaml")"
          digest="$(oras resolve "ghcr.io/${GITHUB_REPOSITORY}/${CHART#charts/}:${version}")"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}/${CHART#charts/}@${digest}"
      - run: oras push "ghcr.io/${GITHUB_REPOSITORY}/${CHART#charts/}:artifacthub.io" --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml .github/artifacthub-repo.yaml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - run: pip install yq
      - name: Install sponge
        run: sudo apt-get -yq install moreutils
      - run: /home/linuxbrew/.linuxbrew/bin/brew install syft
      - name: Generate SBOM
        env:
          TEUTO_PORTAL_WORKER_PULL_TOKEN: ${{ secrets.TEUTO_PORTAL_WORKER_PULL_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          mkdir -p reports
          ./.github/scripts/generate-sbom.sh "${CHART}" "reports/${CHART#charts/}.spdx.json"
      - name: Attach SBOM to chart artifact
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          version="$(yq -r '.version' "${CHART}/Chart.yaml")"
          oras attach --artifact-type application/spdx+json \
            "ghcr.io/${GITHUB_REPOSITORY}/${CHART#charts/}:${version}" \
            "reports/${CHART#charts/}.spdx.json:application/spdx+json"
  abort:
    runs-on: ubuntu-latest
    needs: release_please
    permissions:
      actions: write
    if: ${{ !needs.release_please.outputs.releases_created }}
    steps:
      - name: abort if no release was made
        run: |
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
