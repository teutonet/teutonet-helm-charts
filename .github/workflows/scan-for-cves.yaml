name: Scan for CVEs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

env:
  TITLE: CVE Scan failed

jobs:
  getAllCharts:
    uses: ./.github/workflows/get-all-charts.yaml
    permissions:
      contents: read
    with:
      showLibraryCharts: false

  generateSarifReports:
    runs-on: ubuntu-latest
    needs: getAllCharts
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.getAllCharts.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: /home/linuxbrew/.linuxbrew/bin/brew install grype
      - run: pip install yq
      - name: Install sponge
        run: sudo apt-get -yq install moreutils
      - name: Generate sarif reports
        env:
          TEUTO_PORTAL_WORKER_PULL_TOKEN: ${{ secrets.TEUTO_PORTAL_WORKER_PULL_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./.github/scripts/generate-sarif-reports.sh "charts/${{ matrix.chart }}"
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: ${{ hashFiles('reports/*.sarif') != '' }}
        with:
          sarif_file: reports
          # TODO: github dependency tree?

  createIssue:
    runs-on: ubuntu-latest
    if: ${{ always() && needs.generateSarifReports.result == 'failure' }}
    needs: generateSarifReports
    permissions:
      issues: write
    name: Create Issue
    steps:
      - name: Check for existing open issue
        id: existing
        run: |
          count="$(gh issue list --search "\"$TITLE\" in:title" --state open --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Create issue
        if: ${{ steps.existing.outputs.count == '0' }}
        run: |
          gh issue create \
            --title "$TITLE" \
            --assignee "$ASSIGNEES" \
            --label "$LABELS" \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEES: cwrau,marvinWolff,tasches
          LABELS: bug
          BODY: |
            Last run of CVE scanning failed.

  closeIssue:
    runs-on: ubuntu-latest
    if: ${{ always() && needs.generateSarifReports.result == 'success' }}
    needs: generateSarifReports
    permissions:
      issues: write
    name: Close Issue
    steps:
      - name: Close stale CVE Scan failed issue
        run: |
          gh issue list --search "\"$TITLE\" in:title" --state open --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[].number" \
            | xargs -r -n1 -I{} gh issue close {} --comment "CVE scan is passing again."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
