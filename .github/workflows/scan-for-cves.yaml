name: Scan for CVEs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

env:
  TITLE: CVE Scan failed

jobs:
  getAllCharts:
    uses: ./.github/workflows/get-all-charts.yaml
    permissions:
      contents: read
    with:
      showLibraryCharts: false

  generateSarifReports:
    # registry-gitlab.teuto.net (and its token endpoint on gitlab.teuto.net) is only reachable from within our infrastructure
    runs-on: ${{ matrix.chart == 'teuto-portal-k8s-worker' && 'self-hosted-small' || 'ubuntu-latest' }}
    needs: getAllCharts
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.getAllCharts.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
      - if: ${{ runner.environment == 'github-hosted' }}
        run: pip install yq
      - name: Install sponge
        if: ${{ runner.environment == 'github-hosted' }}
        run: sudo apt-get -yq install moreutils
      - if: ${{ runner.environment == 'self-hosted' }}
        run: ./.github/scripts/check-runner-tools.sh yq jq parallel sponge grype
      - name: Generate sarif reports
        env:
          TEUTO_PORTAL_WORKER_PULL_TOKEN: ${{ secrets.TEUTO_PORTAL_WORKER_PULL_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          [[ -n "$GRYPE" ]] && PATH="$(dirname "$GRYPE"):$PATH"
          ./.github/scripts/generate-sarif-reports.sh "charts/${{ matrix.chart }}"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: ${{ hashFiles('reports/*.sarif') != '' }}
        with:
          sarif_file: reports
          # TODO: github dependency tree?

  createIssue:
    runs-on: ubuntu-latest
    if: ${{ always() && needs.generateSarifReports.result == 'failure' }}
    needs: generateSarifReports
    permissions:
      issues: write
    name: Create Issue
    steps:
      - name: Check for existing open issue
        id: existing
        run: |
          count="$(gh issue list --search "\"$TITLE\" in:title" --state open --json title --jq "[.[] | select(.title == \"$TITLE\")] | length")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Create issue
        if: ${{ steps.existing.outputs.count == '0' }}
        run: |
          gh issue create \
            --title "$TITLE" \
            --assignee "$ASSIGNEES" \
            --label "$LABELS" \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEES: cwrau,marvinWolff,tasches
          LABELS: bug
          BODY: |
            Last run of CVE scanning failed.

  closeIssue:
    runs-on: ubuntu-latest
    if: ${{ always() && needs.generateSarifReports.result == 'success' }}
    needs: generateSarifReports
    permissions:
      issues: write
    name: Close Issue
    steps:
      - name: Close stale CVE Scan failed issue
        run: |
          gh issue list --search "\"$TITLE\" in:title" --state open --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[].number" \
            | xargs -r -n1 -I{} gh issue close {} --comment "CVE scan is passing again."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
