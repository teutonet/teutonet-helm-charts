name: Check used licenses
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - charts/**
      - .github/image_licenses.yaml
      - .github/scripts/check-license-links.sh
  merge_group:
    types:
      - checks_requested

jobs:
  getChangedCharts:
    uses: ./.github/workflows/get-changed-charts.yaml
    permissions:
      pull-requests: read
    with:
      pr_number: ${{ github.event.pull_request.number || -1 }}
      base_commit: ${{ github.event.merge_group.base_sha || 'missing' }}
      head_commit: ${{ github.event.merge_group.head_sha || 'missing' }}
  check-licenses:
    name: check licenses
    if: ${{ needs.getChangedCharts.outputs.count > 0 }}
    permissions:
      contents: read
    # registry-gitlab.teuto.net (and its token endpoint on gitlab.teuto.net) is only reachable from within our infrastructure,
    # only use the self-hosted runner where the image scan runs, fork PRs must never run on it
    runs-on: ${{ matrix.chart == 'teuto-portal-k8s-worker' && (github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && 'self-hosted-small' || 'ubuntu-latest' }}
    needs: getChangedCharts
    strategy:
      matrix:
        chart: ${{ fromJson(needs.getChangedCharts.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
      # Fork PRs don't get the registry pull tokens, the image scan only runs for PRs from this repository
      # and in the merge queue, which a maintainer has to add the PR to after reviewing it.
      CAN_SCAN: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: ${{ runner.environment == 'github-hosted' }}
        run: pip install yq
      - name: Install sponge
        if: ${{ runner.environment == 'github-hosted' }}
        run: sudo apt-get -yq install moreutils
      - if: ${{ runner.environment == 'self-hosted' }}
        run: ./.github/scripts/check-runner-tools.sh yq jq parallel sponge flock syft trivy

      - run: ./.github/scripts/prepare-values.sh "charts/$CHART"

      - run: ./.github/scripts/extract-artifacthub-images.sh "charts/$CHART"

      - run: ./.github/scripts/enforce-trusted-registries.sh "charts/$CHART"

      - run: ./.github/scripts/check-licenses.sh "charts/$CHART"

      - if: ${{ env.CAN_SCAN == 'true' && runner.environment == 'github-hosted' }}
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - if: ${{ env.CAN_SCAN == 'true' && runner.environment == 'github-hosted' }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - if: ${{ env.CAN_SCAN == 'true' }}
        env:
          TEUTO_PORTAL_WORKER_PULL_TOKEN: ${{ secrets.TEUTO_PORTAL_WORKER_PULL_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          [[ -n "$SYFT" ]] && PATH="$(dirname "$SYFT"):$PATH"
          ./.github/scripts/scan-for-licenses.sh "charts/$CHART"
  check-license-links:
    if: ${{ github.event_name == 'pull_request' || needs.getChangedCharts.outputs.count > 0 }}
    needs: getChangedCharts
    uses: ./.github/workflows/check-license-links.yaml
    permissions:
      contents: read
