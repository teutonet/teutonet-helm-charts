name: Check used licenses
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - charts/**
      - .github/image_licenses.yaml
      - .github/scripts/check-license-links.sh
  merge_group:
    types:
      - checks_requested

jobs:
  getChangedCharts:
    uses: ./.github/workflows/get-changed-charts.yaml
    permissions:
      pull-requests: read
    with:
      pr_number: ${{ github.event.pull_request.number || -1 }}
      base_commit: ${{ github.event.merge_group.base_sha || 'missing' }}
      head_commit: ${{ github.event.merge_group.head_sha || 'missing' }}
  check-licenses:
    name: check licenses
    if: ${{ needs.getChangedCharts.outputs.count > 0 }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: getChangedCharts
    strategy:
      matrix:
        chart: ${{ fromJson(needs.getChangedCharts.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
      # Fork PRs don't get the registry pull tokens, the image scan only runs for PRs from this repository
      # and in the merge queue, which a maintainer has to add the PR to after reviewing it.
      CAN_SCAN: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install yq
      - name: Install sponge
        run: sudo apt-get -yq install moreutils

      - run: ./.github/scripts/prepare-values.sh "charts/$CHART"

      - run: ./.github/scripts/extract-artifacthub-images.sh "charts/$CHART"

      - run: ./.github/scripts/enforce-trusted-registries.sh "charts/$CHART"

      - run: ./.github/scripts/check-licenses.sh "charts/$CHART"

      - if: ${{ env.CAN_SCAN == 'true' }}
        run: /home/linuxbrew/.linuxbrew/bin/brew install syft trivy
      - if: ${{ env.CAN_SCAN == 'true' }}
        env:
          TEUTO_PORTAL_WORKER_PULL_TOKEN: ${{ secrets.TEUTO_PORTAL_WORKER_PULL_TOKEN }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          [[ "$RUNNER_DEBUG" == 1 ]] && set -x
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ./.github/scripts/scan-for-licenses.sh "charts/$CHART"
  check-license-links:
    if: ${{ github.event_name == 'pull_request' || needs.getChangedCharts.outputs.count > 0 }}
    needs: getChangedCharts
    uses: ./.github/workflows/check-license-links.yaml
    permissions:
      contents: read
