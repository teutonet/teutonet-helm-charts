suite: RBAC legacy serviceAccounts
templates:
  - templates/rbac/legacyServiceAccounts.yaml
  - templates/rbac/roleBindings.yaml
release:
  name: base-cluster
  namespace: flux-system
tests:
  - it: creates nothing without legacy serviceAccounts
    template: templates/rbac/legacyServiceAccounts.yaml
    values:
      - fixtures/rbac-pod-reader-role.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: creates ServiceAccount and token Secret
    template: templates/rbac/legacyServiceAccounts.yaml
    values:
      - fixtures/rbac-pod-reader-role.yaml
    set:
      rbac.legacy.serviceAccounts.ci-bot.clusterRoles[0]: pod-reader
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: base-cluster-ci-bot
        documentIndex: 0
      - isKind:
          of: Secret
        documentIndex: 1
      - equal:
          path: type
          value: kubernetes.io/service-account-token
        documentIndex: 1
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: base-cluster-ci-bot
        documentIndex: 1

  - it: binds ServiceAccount subject in ClusterRoleBinding
    template: templates/rbac/roleBindings.yaml
    values:
      - fixtures/rbac-pod-reader-role.yaml
    set:
      rbac.legacy.serviceAccounts.ci-bot.clusterRoles[0]: pod-reader
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: base-cluster-ci-bot
            namespace: flux-system

  - it: ServiceAccount, account and group share one binding
    template: templates/rbac/roleBindings.yaml
    values:
      - fixtures/rbac-pod-reader-role.yaml
    set:
      rbac.legacy.serviceAccounts.ci-bot.clusterRoles[0]: pod-reader
      rbac.accounts.someone.clusterRoles[0]: pod-reader
      rbac.groups.my-group.clusterRoles[0]: pod-reader
    asserts:
      - lengthEqual:
          path: subjects
          count: 3

  - it: same name as account and legacy serviceAccount does not collide
    template: templates/rbac/roleBindings.yaml
    values:
      - fixtures/rbac-pod-reader-role.yaml
    set:
      rbac.legacy.serviceAccounts.same.clusterRoles[0]: pod-reader
      rbac.accounts.same.clusterRoles[0]: pod-reader
    asserts:
      - lengthEqual:
          path: subjects
          count: 2

  - it: fails when legacy serviceAccount references undefined role
    template: templates/rbac/roleBindings.yaml
    values:
      - fixtures/rbac-pod-reader-role.yaml
    set:
      rbac.legacy.serviceAccounts.ci-bot.clusterRoles[0]: nonexistent-role
    asserts:
      - failedTemplate:
          errorMessage: "Role 'nonexistent-role' doesn't exist, used in legacy serviceAccount 'ci-bot'"
