suite: ingress block policy
templates:
  - templates/ingress/block-ingress.yaml
release:
  name: base-cluster
set:
  global.baseDomain: example.com
  global.clusterName: test
  ingress.useProxyProtocol: false
tests:
  - it: renders policy and binding by default with envoy
    capabilities:
      apiVersions:
        - admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ValidatingAdmissionPolicy
        documentIndex: 0
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value:
            - CREATE
            - UPDATE
        documentIndex: 0
      - equal:
          path: spec.validationActions
          value:
            - Deny
        documentIndex: 1
  - it: does not render when opted out
    set:
      ingress.blockIngressResource: false
    asserts:
      - hasDocuments:
          count: 0
  - it: does not render for traefik by default
    set:
      ingress.provider: traefik
    asserts:
      - hasDocuments:
          count: 0
  - it: renders for traefik when forced
    set:
      ingress.provider: traefik
      ingress.blockIngressResource: true
    asserts:
      - hasDocuments:
          count: 2
  - it: does not render by default when the cluster has no v1 ValidatingAdmissionPolicy
    asserts:
      - hasDocuments:
          count: 0
