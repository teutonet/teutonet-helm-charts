suite: ingress envoy provider enum and namespace
templates:
  - templates/global/namespaces.yaml
release:
  name: base-cluster
tests:
  - it: ingress namespace renders when provider is envoy
    set:
      ingress.provider: envoy
      global.baseDomain: example.com
      global.clusterName: test
    asserts:
      - hasDocuments:
          count: 7
---
suite: ingress envoy provider
templates:
  - templates/ingress/envoy.yaml
release:
  name: base-cluster
set:
  ingress.provider: envoy
  global.baseDomain: example.com
  global.clusterName: test
  ingress.useProxyProtocol: false
tests:
  - it: renders CRDs HelmRelease, controller HelmRelease, and the wrapped GatewayClass/EnvoyProxy/Gateway/HTTPRoute/ClientTrafficPolicy resources
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        isKind:
          of: HelmRelease
      - documentIndex: 0
        equal:
          path: metadata.name
          value: envoy-gateway-crds
      - documentIndex: 0
        equal:
          path: spec.values.crds.gatewayAPI.enabled
          value: false
      - documentIndex: 0
        equal:
          path: spec.values.crds.envoyGateway.enabled
          value: true
      - documentIndex: 1
        isKind:
          of: HelmRelease
      - documentIndex: 1
        equal:
          path: metadata.name
          value: ingress-controller
      - documentIndex: 1
        equal:
          path: spec.values.crds.enabled
          value: false
      - documentIndex: 1
        equal:
          path: spec.dependsOn[0].name
          value: envoy-gateway-crds
      - documentIndex: 1
        equal:
          path: spec.dependsOn[0].namespace
          value: ingress
      - documentIndex: 2
        isKind:
          of: HelmRelease
      - documentIndex: 2
        equal:
          path: metadata.name
          value: ingress-controller-resources
      - documentIndex: 2
        equal:
          path: spec.dependsOn[0].name
          value: envoy-gateway-crds
      - documentIndex: 2
        equal:
          path: spec.dependsOn[0].namespace
          value: ingress
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "kind: GatewayClass"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "controllerName: gateway.envoyproxy.io/gatewayclass-controller"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "kind: EnvoyProxy"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "name: ingress-controller-service"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "mergeType: StrategicMerge"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "replicas: 2"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "kind: Gateway"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "gatewayClassName: default"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "name: cluster-wildcard-certificate"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "kind: HTTPRoute"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "type: RequestRedirect"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "kind: ClientTrafficPolicy"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "enableProxyProtocol: false"

  - it: pins loadBalancerIP and floating-ip annotation when ingress.IP is set
    set:
      ingress.IP: 10.0.0.100
    asserts:
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: 'loadBalancerIP: "10\.0\.0\.100"'
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: 'loadbalancer.openstack.org/keep-floatingip: "true"'

  - it: does not render when provider is traefik
    set:
      ingress.provider: traefik
    asserts:
      - hasDocuments:
          count: 0

  - it: wrapped resources HelmRelease depends on the CRDs HelmRelease so it is not applied before the CRDs are ready
    asserts:
      - documentIndex: 2
        lengthEqual:
          path: spec.dependsOn
          count: 1

  - it: sets the OpenTelemetry tracing provider type when telemetry is auto-discovered
    kubernetesProvider:
      scheme:
        "v1/Service":
          gvr:
            version: v1
            resource: services
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: telemetry-collector
            namespace: monitoring
          spec:
            ports:
              - name: otlp
                port: "4317"
    asserts:
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "type: OpenTelemetry"
      - documentIndex: 2
        matchRegex:
          path: spec.values.static
          pattern: "name: telemetry-collector"
