suite: ingress envoy provider enum and namespace
templates:
  - templates/global/namespaces.yaml
release:
  name: base-cluster
tests:
  - it: ingress namespace renders when provider is envoy
    set:
      ingress.provider: envoy
      global.baseDomain: example.com
      global.clusterName: test
    asserts:
      - hasDocuments:
          count: 7
---
suite: ingress envoy provider
templates:
  - templates/ingress/envoy.yaml
release:
  name: base-cluster
set:
  ingress.provider: envoy
  global.baseDomain: example.com
  global.clusterName: test
  ingress.useProxyProtocol: false
tests:
  - it: renders the controller HelmRelease and the wrapped GatewayClass/EnvoyProxy/Gateway/HTTPRoute/ClientTrafficPolicy resources, but no CRDs HelmRelease
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        isKind:
          of: HelmRelease
      - documentIndex: 0
        equal:
          path: metadata.name
          value: ingress-controller
      - documentIndex: 0
        equal:
          path: spec.values.crds.enabled
          value: false
      - documentIndex: 1
        isKind:
          of: HelmRelease
      - documentIndex: 1
        equal:
          path: metadata.name
          value: ingress-controller-resources
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "kind: GatewayClass"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "controllerName: gateway.envoyproxy.io/gatewayclass-controller"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "kind: EnvoyProxy"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "name: ingress-controller-service"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "mergeType: StrategicMerge"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "replicas: 2"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "kind: Gateway"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "gatewayClassName: default"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "name: cluster-wildcard-certificate"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "kind: HTTPRoute"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "type: RequestRedirect"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "kind: ClientTrafficPolicy"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "enableProxyProtocol: false"

  - it: patches the proxy Deployment and Service selectors to the overridden pod name label, since Envoy Gateway otherwise builds a selector that does not match the template labels
    asserts:
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "(?s)labels:\\s+app.kubernetes.io/name: ingress-controller\\s+(#[^\\n]*\\s+)*patch:"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "(?s)envoyDeployment:.*?patch:\\s+type: StrategicMerge\\s+value:\\s+spec:\\s+selector:\\s+matchLabels:\\s+app.kubernetes.io/name: ingress-controller"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "(?s)envoyService:.*?patch:\\s+type: StrategicMerge\\s+value:\\s+spec:\\s+selector:\\s+app.kubernetes.io/name: ingress-controller"

  - it: pins loadBalancerIP and floating-ip annotation when ingress.IP is set
    set:
      ingress.IP: 10.0.0.100
    asserts:
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: 'loadBalancerIP: "10\.0\.0\.100"'
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: 'loadbalancer.openstack.org/keep-floatingip: "true"'

  - it: does not render when provider is traefik
    set:
      ingress.provider: traefik
    asserts:
      - hasDocuments:
          count: 0

  - it: no HelmRelease depends on a CRDs HelmRelease, since the CRDs are installed by a Flux Kustomization instead
    asserts:
      - documentIndex: 0
        notContains:
          path: spec.dependsOn
          content:
            name: envoy-gateway-crds
            namespace: ingress
      - documentIndex: 1
        notExists:
          path: spec.dependsOn

  - it: sets the OpenTelemetry tracing provider type when telemetry is auto-discovered
    kubernetesProvider:
      scheme:
        "v1/Service":
          gvr:
            version: v1
            resource: services
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: telemetry-collector
            namespace: monitoring
          spec:
            ports:
              - name: otlp
                port: "4317"
    asserts:
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "type: OpenTelemetry"
      - documentIndex: 1
        matchRegex:
          path: spec.values.static
          pattern: "name: telemetry-collector"
