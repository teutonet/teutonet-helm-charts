{{- $roles := include "base-cluster.rbac.roles" (dict "accounts" .Values.rbac.accounts "groups" .Values.rbac.groups "roles" (.Values.rbac.roles | keys) "namespaces" (include "base-cluster.enabled-namespaces" (dict "context" .) | fromYaml | keys)) | fromYaml -}}
{{- $definedRoles := .Values.rbac.roles | keys -}}

{{- range $roleName, $roleMapping := $roles -}}
  {{- $clusterMapping := dig "clusterMapping" (list) $roleMapping -}}
  {{- $namespaceMapping := dig "namespaceMapping" (dict) $roleMapping -}}
  {{- $roleBindingFullName := printf "%s-%s" (include "common.names.fullname" $) $roleName -}}
  {{- $roleFullName := has $roleName $definedRoles | ternary (printf "%s-%s" (include "common.names.fullname" $) $roleName) $roleName -}}
  {{- range $namespace, $subjects := $namespaceMapping }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleBindingFullName }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: rbac
  namespace: {{ $namespace }}
subjects: {{- toYaml $subjects | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleFullName }}
  {{- end }}
  {{- if $clusterMapping }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $roleBindingFullName }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: rbac
subjects: {{- toYaml $clusterMapping | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleFullName }}
  {{- end }}
{{- end }}
