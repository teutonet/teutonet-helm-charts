apiVersion: v2
name: managed-monitoring
description: >-
  Deploys the metrics-forwarding agent for a managed service (e.g. teuto-cnpg databases)
  into a workload cluster remotely from the management cluster, without requiring
  Flux on the workload cluster itself.
maintainers:
  - email: cwr@teuto.net
    name: cwrau
  - email: mw@teuto.net
    name: marvinWolff
  - email: st@teuto.net
    name: tasches
type: application
version: 1.0.0
dependencies:
  - name: common
    repository: oci://ghcr.io/teutonet/teutonet-helm-charts
    version: 2.2.0
sources:
  - https://github.com/teutonet/teutonet-helm-charts/tree/managed-monitoring-v1.0.0/charts/managed-monitoring
  - https://github.com/teutonet/teutonet-helm-charts/tree/main/charts/managed-monitoring
annotations:
  artifacthub.io/images: |-
    - image: docker.io/grafana/alloy:v1.21.1                                                                                                         #  default/HelmRelease/managed-monitoring-ma/teuto-managed-operators/Deployment/metrics-agent.yaml
    - image: quay.io/prometheus-operator/prometheus-config-reloader:v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71  #  default/HelmRelease/managed-monitoring-ma/teuto-managed-operators/Deployment/metrics-agent.yaml
