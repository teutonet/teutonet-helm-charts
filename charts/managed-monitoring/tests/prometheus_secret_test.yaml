suite: prometheus-secret HelmRelease
templates:
  - templates/prometheus-secret.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
set:
  targetCluster.kubeconfigSecretName: test-cluster-kubeconfig
  prometheus.existingSecret.name: prometheus-write
tests:
  - it: fails when the kubeconfig secret can't be derived or found
    release:
      name: some-cluster-mm
    set:
      targetCluster.kubeconfigSecretName: ""
    asserts:
      - failedTemplate:
          errorMessage: "Could not find Secret 'some-cluster-kubeconfig' derived from release name 'some-cluster-mm' (expected '<cluster-name>-mm'); set targetCluster.kubeconfigSecretName explicitly"

  - it: derives the kubeconfig secret name from the release name when installed as <cluster>-mm and the secret exists
    release:
      name: some-cluster-mm
    set:
      targetCluster.kubeconfigSecretName: ""
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: some-cluster-kubeconfig
            namespace: NAMESPACE
    asserts:
      - equal:
          path: metadata.name
          value: some-cluster-mm-pw
      - equal:
          path: spec.kubeConfig.secretRef.name
          value: some-cluster-kubeconfig

  - it: pulls the username/password from the source secret via top-level valuesFrom targets, resolved inside the static manifest string by cetic/static's own tpl call, instead of embedding them directly
    release:
      name: test-release
    set:
      prometheus.existingSecret.name: some-customer-specific-secret-name
      namespace: teuto-managed-operators
    asserts:
      - equal:
          path: kind
          value: HelmRelease
      - equal:
          path: metadata.name
          value: test-release-pw
      - equal:
          path: spec.kubeConfig.secretRef.name
          value: test-cluster-kubeconfig
      - equal:
          path: spec.targetNamespace
          value: teuto-managed-operators
      - equal:
          path: spec.valuesFrom
          value:
            - kind: Secret
              name: some-customer-specific-secret-name
              optional: false
              targetPath: username
              valuesKey: username
            - kind: Secret
              name: some-customer-specific-secret-name
              optional: false
              targetPath: password
              valuesKey: password
      - matchRegex:
          path: spec.values.static
          pattern: "name: prometheus-write"
      - matchRegex:
          path: spec.values.static
          pattern: "type: Opaque"
      - matchRegex:
          path: spec.values.static
          pattern: '(?m)^\s+username:\s+\{\{\s*\.Values\.username\s*\}\}\s*$'
      - matchRegex:
          path: spec.values.static
          pattern: '(?m)^\s+password:\s+\{\{\s*\.Values\.password\s*\}\}\s*$'
      - matchSnapshot:
          path: ""
