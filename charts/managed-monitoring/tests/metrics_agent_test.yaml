suite: metrics-agent HelmRelease
templates:
  - templates/metrics-agent.yaml
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
set:
  prometheus.existingSecret.name: prometheus-write
tests:
  - it: fails when the kubeconfig secret can't be derived or found, and no override is set
    release:
      name: some-cluster-mm
    asserts:
      - failedTemplate:
          errorMessage: "Could not find Secret 'some-cluster-kubeconfig' derived from release name 'some-cluster-mm' (expected '<cluster-name>-mm'); set targetCluster.kubeconfigSecretName explicitly"

  - it: derives the kubeconfig secret name from the release name when installed as <cluster>-mm and the secret exists, with defaults applied
    release:
      name: 1111-example-customer-mm
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: 1111-example-customer-kubeconfig
            namespace: NAMESPACE
    asserts:
      - equal:
          path: kind
          value: HelmRelease
      - equal:
          path: metadata.name
          value: 1111-example-customer-mm-ma
      - equal:
          path: spec.kubeConfig.secretRef.name
          value: 1111-example-customer-kubeconfig
      - equal:
          path: spec.dependsOn[0].name
          value: 1111-example-customer-mm-pw
      - equal:
          path: spec.chart.spec.chart
          value: alloy
      - equal:
          path: spec.chart.spec.version
          value: 1.12.1
      - equal:
          path: spec.chart.spec.sourceRef
          value:
            kind: HelmRepository
            name: grafana
            namespace: flux-system
      - equal:
          path: spec.targetNamespace
          value: teuto-managed-operators
      - equal:
          path: spec.values.fullnameOverride
          value: metrics-agent
      - equal:
          path: spec.values.alloy.extraEnv[0].valueFrom.secretKeyRef.name
          value: prometheus-write
      - equal:
          path: spec.values.alloy.extraEnv[1].valueFrom.secretKeyRef.name
          value: prometheus-write
      - matchRegex:
          path: spec.values.alloy.configMap.content
          pattern: url\s*=\s*"https://prometheus\.teuto\.net:9090/api/v1/write"
      - matchSnapshot:
          path: ""

  - it: limits the agent's RBAC to reading pods instead of the alloy chart's cluster-wide secrets/configmaps defaults
    release:
      name: some-cluster-mm
    set:
      targetCluster.kubeconfigSecretName: explicit-kubeconfig
    asserts:
      - equal:
          path: spec.values.rbac
          value:
            rules:
              - apiGroups:
                  - ""
                resources:
                  - pods
                verbs:
                  - get
            clusterRules:
              - apiGroups:
                  - ""
                resources:
                  - pods
                verbs:
                  - list
                  - watch

  - it: pins cluster identity from the release instead of workload-cluster node annotations
    release:
      name: 1111-example-customer-mm
      namespace: teuto-example
    set:
      targetCluster.kubeconfigSecretName: explicit-kubeconfig
    asserts:
      - matchRegex:
          path: spec.values.alloy.configMap.content
          pattern: 'target_label\s*=\s*"cluster"\s*\n\s*replacement\s*=\s*"1111-example-customer"\s*\n'
      - matchRegex:
          path: spec.values.alloy.configMap.content
          pattern: 'target_label\s*=\s*"cluster_namespace"\s*\n\s*replacement\s*=\s*"teuto-example"\s*\n'
      - matchRegex:
          path: spec.values.alloy.configMap.content
          pattern: 'prometheus\.scrape "pods" \{[^}]*forward_to\s*=\s*\[prometheus\.relabel\.identity\.receiver\]'
      - matchRegex:
          path: spec.values.alloy.configMap.content
          pattern: 'prometheus\.relabel "identity" \{\s*forward_to\s*=\s*\[prometheus\.remote_write\.ffm\.receiver\]'
      - notMatchRegex:
          path: spec.values.alloy.configMap.content
          pattern: 'node_annotation'
      - notMatchRegex:
          path: spec.values.alloy.configMap.content
          pattern: 'discovery\.kubernetes "nodes"'

  - it: honors an explicit kubeconfig secret name override even when derivation would fail
    release:
      name: not-following-convention
    set:
      targetCluster.kubeconfigSecretName: explicit-kubeconfig
    asserts:
      - equal:
          path: spec.kubeConfig.secretRef.name
          value: explicit-kubeconfig
      - matchRegex:
          path: spec.values.alloy.configMap.content
          pattern: 'target_label\s*=\s*"cluster"\s*\n\s*replacement\s*=\s*"not-following-convention"\s*\n'

  - it: honors a custom prometheus url and namespace
    release:
      name: another-cluster-mm
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: another-cluster-kubeconfig
            namespace: NAMESPACE
    set:
      namespace: monitoring
      prometheus.url: https://prometheus.example.com/api/v1/write
    asserts:
      - equal:
          path: spec.targetNamespace
          value: monitoring
      - equal:
          path: spec.storageNamespace
          value: monitoring
      - matchRegex:
          path: spec.values.alloy.configMap.content
          pattern: url\s*=\s*"https://prometheus\.example\.com/api/v1/write"
