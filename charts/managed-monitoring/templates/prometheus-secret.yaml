apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ printf "%s-pw" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: prometheus-secret
spec:
  chart:
    spec:
      chart: static
      version: 0.1.1
      sourceRef:
        kind: HelmRepository
        name: cetic
        namespace: flux-system
  interval: 1h
  driftDetection:
    mode: enabled
  kubeConfig:
    secretRef:
      name: {{ include "managed-monitoring.kubeconfigSecretName" $ }}
  install:
    remediation:
      retries: -1
  uninstall:
    disableWait: true
  storageNamespace: {{ .Values.namespace }}
  targetNamespace: {{ .Values.namespace }}
  releaseName: prometheus-write
  valuesFrom:
    - &valuesFrom
      kind: Secret
      name: {{ .Values.prometheus.existingSecret.name }}
      optional: false
      targetPath: username
      valuesKey: username
    - <<: *valuesFrom
      targetPath: password
      valuesKey: password
  values:
    static: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: prometheus-write
        labels: {{- include "common.labels.standard" $ | nindent 10 }}
          app.kubernetes.io/component: prometheus-secret
      type: Opaque
      stringData:
        username: {{ "{{" }} .Values.username {{ "}}" }}
        password: {{ "{{" }} .Values.password {{ "}}" }}
