suite: common.telemetry.conf
templates:
  - templates/telemetry-stub.yaml
release:
  name: common-test
tests:
  - it: no output when protocol not set
    asserts:
      - hasDocuments:
          count: 0

  - it: disabled when no endpoint configured and no service found
    set:
      protocol: otlp
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: enabled
          value: false

  - it: parses host and port from endpoint string
    set:
      protocol: otlp
      global.telemetry.otlp.endpoint: "otel-collector:4317"
    asserts:
      - equal:
          path: enabled
          value: true
      - equal:
          path: host
          value: otel-collector
      - equal:
          path: port
          value: 4317

  - it: exposes serviceName and serviceNamespace when auto-discovered
    set:
      protocol: otlp
    kubernetesProvider:
      scheme:
        "v1/Service":
          gvr:
            group: ""
            version: "v1"
            resource: "services"
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: alloy
            namespace: monitoring
          spec:
            ports:
              - name: otlp-grpc
                port: 4317.0
                appProtocol: grpc
    asserts:
      - equal:
          path: enabled
          value: true
      - equal:
          path: serviceName
          value: alloy
      - equal:
          path: serviceNamespace
          value: monitoring
      - equal:
          path: host
          value: alloy.monitoring
      - equal:
          path: port
          value: 4317
      - equal:
          path: endpoint
          value: http://alloy.monitoring:4317

  - it: does not expose serviceName/serviceNamespace for an explicit external endpoint
    set:
      protocol: otlp
      global.telemetry.otlp.endpoint: "otel-collector.example.com:4317"
    asserts:
      - equal:
          path: enabled
          value: true
      - notExists:
          path: serviceName
      - notExists:
          path: serviceNamespace

  - it: uses explicit port when provided
    set:
      protocol: otlp
      global.telemetry.otlp.endpoint: "otel-collector:4317"
      global.telemetry.otlp.port: 9999
    asserts:
      - equal:
          path: port
          value: 9999

  - it: explicit host overrides endpoint-parsed host
    set:
      protocol: otlp
      global.telemetry.otlp.endpoint: "otel-collector:4317"
      global.telemetry.otlp.host: custom-host
    asserts:
      - equal:
          path: host
          value: custom-host

  - it: parses host and port from endpoint with http scheme
    set:
      protocol: otlp
      global.telemetry.otlp.endpoint: "http://otel-collector:4317"
    asserts:
      - equal:
          path: enabled
          value: true
      - equal:
          path: host
          value: otel-collector
      - equal:
          path: port
          value: 4317

  - it: parses host and port from endpoint with https scheme
    set:
      protocol: otlp
      global.telemetry.otlp.endpoint: "https://otel-collector:4317"
    asserts:
      - equal:
          path: enabled
          value: true
      - equal:
          path: host
          value: otel-collector
      - equal:
          path: port
          value: 4317

  - it: fails when endpoint has no port and port not set
    set:
      protocol: otlp
      global.telemetry.otlp.endpoint: "otel-collector"
    asserts:
      - failedTemplate:
          errorMessage: "You need to provide the port, at least in the endpoint"
