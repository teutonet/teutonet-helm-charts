apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ printf "%s" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  env:
  - name: AWS_REQUEST_CHECKSUM_CALCULATION
    value: when_required
  - name: AWS_RESPONSE_CHECKSUM_VALIDATION
    value: when_required
  affinity:
    podAntiAffinityType: preferred
  primaryUpdateMethod: switchover
  enablePDB: true
  enableSuperuserAccess: true
  failoverDelay: 0
  imageName: {{ include "common.images.image" (dict "imageRoot" .Values.databaseImage "global" .Values.global) }}
  instances: {{ .Values.instances }}
  logLevel: {{ .Values.logLevel }}
  {{- if .Values.backup }}
  {{- if and .Values.backup.bootstrapRestore .Values.backup.bootstrapRestore.enabled }}
  bootstrap:
    recovery:
      source: source
      {{- with .Values.backup.bootstrapRestore.targetTime }}
      recoveryTarget:
        targetTime: {{ . | quote }}
      {{- end }}
  externalClusters:
  - name: source
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: {{ .Release.Name }}
        serverName: {{ .Release.Name }}
  {{- else }}
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: {{ .Release.Name }}
  {{- end }}
  {{- end }}
  managed:
    {{- $roles := dict -}}
    {{- if kindIs "string" .Values.roles -}}
      {{- $roles = .Values.roles | fromYamlArray -}}
    {{- else -}}
      {{- $roles = .Values.roles -}}
    {{- end -}}
    {{- $cleanRoles := list -}}
    {{- range $role := $roles -}}
      {{- with $role.passwordSecret -}}
        {{- $role = set $role "passwordSecret" (omit . "exists") -}}
      {{- end -}}
      {{- $cleanRoles = append $cleanRoles $role -}}
    {{- end }}
    roles: {{- $cleanRoles | toYaml | nindent 6  }}
  storage:
    resizeInUseVolumes: true
    size: {{ .Values.storageSize }}
  switchoverDelay: 3600
