suite: GPU operator conditional rendering
templates:
  - templates/workload-cluster/gpu-operator.yaml
release:
  name: my-cluster
tests:
  - it: no output when no GPU flavors in nodePools
    asserts:
      - hasDocuments:
          count: 0

  - it: renders HelmRelease when nodePool has GPU flavor
    set:
      nodePools.gpuworkers.flavor: m1.gpu-large
      nodePools.gpuworkers.replicas: 1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease
      - equal:
          path: spec.values.node-feature-discovery.worker.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: m1.gpu-large

  - it: GPU detection is case-insensitive
    set:
      nodePools.gpuworkers.flavor: m1.GPU-LARGE
      nodePools.gpuworkers.replicas: 1
    asserts:
      - hasDocuments:
          count: 1

  - it: interval is 10s when the HelmRelease does not exist yet
    set:
      nodePools.gpuworkers.flavor: m1.gpu-large
      nodePools.gpuworkers.replicas: 1
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    set:
      nodePools.gpuworkers.flavor: m1.gpu-large
      nodePools.gpuworkers.replicas: 1
    kubernetesProvider:
      scheme:
        helm.toolkit.fluxcd.io/v2/HelmRelease:
          gvr:
            group: helm.toolkit.fluxcd.io
            version: v2
            resource: helmreleases
          namespaced: true
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-gpu-operator
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    set:
      nodePools.gpuworkers.flavor: m1.gpu-large
      nodePools.gpuworkers.replicas: 1
    kubernetesProvider:
      scheme:
        helm.toolkit.fluxcd.io/v2/HelmRelease:
          gvr:
            group: helm.toolkit.fluxcd.io
            version: v2
            resource: helmreleases
          namespaced: true
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-gpu-operator
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.interval
          value: 1h
