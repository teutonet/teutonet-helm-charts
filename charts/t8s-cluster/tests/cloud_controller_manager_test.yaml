suite: cloud-controller-manager
templates:
  - templates/workload-cluster/cloud-controller-manager.yaml
release:
  name: my-cluster
kubernetesProvider:
  scheme:
    helm.toolkit.fluxcd.io/v2/HelmRelease:
      gvr:
        group: helm.toolkit.fluxcd.io
        version: v2
        resource: helmreleases
      namespaced: true
tests:
  - it: renders HelmRelease
    set:
      cni: cilium
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease

  - it: re-adds nodes delete RBAC on the 2.36 chart line
    set:
      cni: cilium
      version:
        minor: 36
    asserts:
      - equal:
          path: spec.postRenderers[0].kustomize.patches[0].target.kind
          value: ClusterRole
      - matchRegex:
          path: spec.postRenderers[0].kustomize.patches[0].patch
          pattern: "value: delete"

  - it: re-adds nodes delete RBAC when a minor without own chart pin falls back to the 2.36 default
    set:
      cni: cilium
      version:
        minor: 35
    asserts:
      - equal:
          path: spec.postRenderers[0].kustomize.patches[0].target.kind
          value: ClusterRole

  - it: does not patch RBAC for chart lines that already grant nodes delete
    set:
      cni: cilium
      version:
        minor: 34
    asserts:
      - notExists:
          path: spec.postRenderers

  - it: does not patch RBAC once the selected chart is 2.37 or newer
    set:
      cni: cilium
      version:
        minor: 37
      global:
        helmRepositories:
          cloud-provider-openstack:
            charts:
              openstack-cloud-controller-manager: 2.37.0
    asserts:
      - notExists:
          path: spec.postRenderers

  - it: hosted control plane on a fixed chart line only patches the DaemonSet
    set:
      cni: cilium
      version:
        minor: 34
      controlPlane:
        hosted: true
    asserts:
      - lengthEqual:
          path: spec.postRenderers[0].kustomize.patches
          count: 1
      - equal:
          path: spec.postRenderers[0].kustomize.patches[0].target.kind
          value: DaemonSet

  - it: hosted control plane on the 2.36 line patches RBAC and DaemonSet
    set:
      cni: cilium
      version:
        minor: 36
      controlPlane:
        hosted: true
    asserts:
      - lengthEqual:
          path: spec.postRenderers[0].kustomize.patches
          count: 2

  - it: interval is 10s when the HelmRelease does not exist yet
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-ccm
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-ccm
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.interval
          value: 1h
