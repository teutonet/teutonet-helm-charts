suite: autoscaler gating and interval
templates:
  - templates/management-cluster/autoscaler.yaml
release:
  name: my-cluster
tests:
  - it: no output when no nodePool has maxReplicas above replicas
    set:
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 3
    asserts:
      - hasDocuments:
          count: 0

  - it: no output when enabled but the kubeconfig secret does not exist
    set:
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 1
      nodePools.workers.maxReplicas: 3
    asserts:
      - hasDocuments:
          count: 0

  - it: renders HelmRelease when enabled and the kubeconfig secret exists
    set:
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 1
      nodePools.workers.maxReplicas: 3
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-cluster-kubeconfig
            namespace: NAMESPACE
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease

  - it: interval is 10s when the HelmRelease does not exist yet
    set:
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 1
      nodePools.workers.maxReplicas: 3
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-cluster-kubeconfig
            namespace: NAMESPACE
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    set:
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 1
      nodePools.workers.maxReplicas: 3
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
        helm.toolkit.fluxcd.io/v2/HelmRelease:
          gvr:
            group: helm.toolkit.fluxcd.io
            version: v2
            resource: helmreleases
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-cluster-kubeconfig
            namespace: NAMESPACE
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-autoscaler
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    set:
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 1
      nodePools.workers.maxReplicas: 3
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr:
            version: v1
            resource: secrets
          namespaced: true
        helm.toolkit.fluxcd.io/v2/HelmRelease:
          gvr:
            group: helm.toolkit.fluxcd.io
            version: v2
            resource: helmreleases
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: my-cluster-kubeconfig
            namespace: NAMESPACE
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-autoscaler
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.interval
          value: 1h
