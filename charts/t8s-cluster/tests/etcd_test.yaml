suite: etcd-defrag gating
templates:
  - templates/workload-cluster/etcd-defrag.yaml
release:
  name: my-cluster
kubernetesProvider:
  scheme:
    helm.toolkit.fluxcd.io/v2/HelmRelease:
      gvr:
        group: helm.toolkit.fluxcd.io
        version: v2
        resource: helmreleases
      namespaced: true
tests:
  - it: no output when controlPlane is hosted
    set:
      controlPlane.hosted: true
    asserts:
      - hasDocuments:
          count: 0

  - it: wraps the HelmRelease in a ResourceSet when controlPlane is not hosted
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ResourceSet
      - isNullOrEmpty:
          path: metadata.annotations
      - equal:
          path: spec.resources[0].kind
          value: HelmRelease
      - equal:
          path: spec.resources[0].metadata.name
          value: my-cluster-etcd-defrag

  - it: sets the reconcile annotation on upgrade when the ResourceSet doesn't exist yet
    release:
      upgrade: true
    asserts:
      - equal:
          path: metadata.annotations["fluxcd.controlplane.io/reconcileEvery"]
          value: 1m

  - it: omits the reconcile annotation when the ResourceSet already exists
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        fluxcd.controlplane.io/v1/ResourceSet:
          gvr:
            group: fluxcd.controlplane.io
            version: v1
            resource: resourcesets
          namespaced: true
      objects:
        - apiVersion: fluxcd.controlplane.io/v1
          kind: ResourceSet
          metadata:
            name: my-cluster-etcd-defrag
            namespace: NAMESPACE
    asserts:
      - isNullOrEmpty:
          path: metadata.annotations

  - it: gates on Cluster ControlPlaneAvailable
    asserts:
      - equal:
          path: spec.dependsOn[0].apiVersion
          value: cluster.x-k8s.io/v1beta2
      - equal:
          path: spec.dependsOn[0].kind
          value: Cluster
      - equal:
          path: spec.dependsOn[0].name
          value: my-cluster
      - equal:
          path: spec.dependsOn[0].ready
          value: true
      - matchRegex:
          path: spec.dependsOn[0].readyExpr
          pattern: ControlPlaneAvailable

  - it: interval is 10s when the HelmRelease does not exist yet
    asserts:
      - equal:
          path: spec.resources[0].spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-etcd-defrag
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.resources[0].spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-etcd-defrag
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.resources[0].spec.interval
          value: 1h

---
suite: etcd-backup gating
templates:
  - templates/workload-cluster/etcd-backup.yaml
release:
  name: my-cluster
tests:
  - it: no output when controlPlane is hosted
    set:
      controlPlane.hosted: true
    asserts:
      - hasDocuments:
          count: 0

  - it: no output when etcdBackup is false
    asserts:
      - hasDocuments:
          count: 0

  - it: wraps the HelmRelease in a ResourceSet when not hosted and etcdBackup is true
    set:
      controlPlane.etcdBackup: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ResourceSet
      - isNullOrEmpty:
          path: metadata.annotations
      - equal:
          path: spec.resources[0].kind
          value: HelmRelease
      - equal:
          path: spec.resources[0].metadata.name
          value: my-cluster-etcd-backup

  - it: sets the reconcile annotation on upgrade when the ResourceSet doesn't exist yet
    set:
      controlPlane.etcdBackup: true
    release:
      upgrade: true
    asserts:
      - equal:
          path: metadata.annotations["fluxcd.controlplane.io/reconcileEvery"]
          value: 1m

  - it: omits the reconcile annotation when the ResourceSet already exists
    set:
      controlPlane.etcdBackup: true
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        fluxcd.controlplane.io/v1/ResourceSet:
          gvr:
            group: fluxcd.controlplane.io
            version: v1
            resource: resourcesets
          namespaced: true
      objects:
        - apiVersion: fluxcd.controlplane.io/v1
          kind: ResourceSet
          metadata:
            name: my-cluster-etcd-backup
            namespace: NAMESPACE
    asserts:
      - isNullOrEmpty:
          path: metadata.annotations

  - it: gates on Cluster ControlPlaneAvailable
    set:
      controlPlane.etcdBackup: true
    asserts:
      - equal:
          path: spec.dependsOn[0].apiVersion
          value: cluster.x-k8s.io/v1beta2
      - equal:
          path: spec.dependsOn[0].kind
          value: Cluster
      - equal:
          path: spec.dependsOn[0].name
          value: my-cluster
      - equal:
          path: spec.dependsOn[0].ready
          value: true
      - matchRegex:
          path: spec.dependsOn[0].readyExpr
          pattern: ControlPlaneAvailable
