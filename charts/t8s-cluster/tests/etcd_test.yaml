suite: etcd-defrag gating
templates:
  - templates/workload-cluster/etcd-defrag.yaml
release:
  name: my-cluster
kubernetesProvider:
  scheme:
    helm.toolkit.fluxcd.io/v2/HelmRelease:
      gvr:
        group: helm.toolkit.fluxcd.io
        version: v2
        resource: helmreleases
      namespaced: true
tests:
  - it: no output when controlPlane is hosted
    set:
      controlPlane.hosted: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders HelmRelease when controlPlane is not hosted
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease

  - it: interval is 10s when the HelmRelease does not exist yet
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-etcd-defrag
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-etcd-defrag
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.interval
          value: 1h

---
suite: etcd-backup gating
templates:
  - templates/workload-cluster/etcd-backup.yaml
release:
  name: my-cluster
tests:
  - it: no output when controlPlane is hosted
    set:
      controlPlane.hosted: true
    asserts:
      - hasDocuments:
          count: 0

  - it: no output when etcdBackup is false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders HelmRelease when not hosted and etcdBackup is true
    set:
      controlPlane.etcdBackup: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease
