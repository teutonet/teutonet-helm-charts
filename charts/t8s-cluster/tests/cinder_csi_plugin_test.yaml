suite: cinder-csi-plugin
templates:
  - templates/workload-cluster/cinder-csi-plugin/cinder-csi-plugin.yaml
release:
  name: my-cluster
kubernetesProvider:
  scheme:
    helm.toolkit.fluxcd.io/v2/HelmRelease:
      gvr:
        group: helm.toolkit.fluxcd.io
        version: v2
        resource: helmreleases
      namespaced: true
tests:
  - it: renders HelmRelease
    set:
      cni: cilium
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease

  - it: interval is 10s when the HelmRelease does not exist yet
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-csi
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-csi
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.interval
          value: 1h

  - it: install and upgrade timeout default to 300s when there are no node pools
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.install.timeout
          value: 300s
      - equal:
          path: spec.upgrade.timeout
          value: 300s

  - it: install and upgrade timeout scale with the summed node pool sizes
    set:
      cni: cilium
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 2
      nodePools.workers.maxReplicas: 5
      nodePools.gpu.flavor: m1.medium
      nodePools.gpu.replicas: 3
    asserts:
      - equal:
          path: spec.install.timeout
          value: 480s
      - equal:
          path: spec.upgrade.timeout
          value: 480s

---
suite: openstack-cinder-csi PodDisruptionBudget
templates:
  - templates/workload-cluster/cinder-csi-plugin/podDisruptionBudget.yaml
release:
  name: my-cluster
tests:
  - it: renders HelmRelease wrapping a PodDisruptionBudget for the controller plugin
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease
      - matchRegex:
          path: spec.values.static
          pattern: "kind: PodDisruptionBudget"
      - matchRegex:
          path: spec.values.static
          pattern: "maxUnavailable: 1"
      - matchRegex:
          path: spec.values.static
          pattern: "app: openstack-cinder-csi"
      - matchRegex:
          path: spec.values.static
          pattern: "component: controllerplugin"
      - matchRegex:
          path: spec.values.static
          pattern: "release: csi"
