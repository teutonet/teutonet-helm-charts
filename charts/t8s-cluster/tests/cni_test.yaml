suite: CNI cilium explicit selection
templates:
  - templates/workload-cluster/cni-cilium.yaml
release:
  name: my-cluster
kubernetesProvider:
  scheme:
    helm.toolkit.fluxcd.io/v2/HelmRelease:
      gvr:
        group: helm.toolkit.fluxcd.io
        version: v2
        resource: helmreleases
      namespaced: true
tests:
  - it: renders HelmRelease when cni is cilium
    set:
      cni: cilium
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HelmRelease

  - it: interval is 10s when the HelmRelease does not exist yet
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-cni
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-cni
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.interval
          value: 1h

  - it: no output when cni is calico
    set:
      cni: calico
    asserts:
      - hasDocuments:
          count: 0

  - it: enables PodDisruptionBudgets for cilium-operator and hubble-ui
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.values.operator.podDisruptionBudget.enabled
          value: true
      - equal:
          path: spec.values.hubble.ui.podDisruptionBudget.enabled
          value: true

---
suite: CNI calico explicit selection
templates:
  - templates/workload-cluster/cni-calico.yaml
release:
  name: my-cluster
tests:
  - it: renders Kustomization when cni is calico
    set:
      cni: calico
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Kustomization

  - it: no output when cni is cilium
    set:
      cni: cilium
    asserts:
      - hasDocuments:
          count: 0
