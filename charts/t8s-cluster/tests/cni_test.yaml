suite: CNI cilium explicit selection
templates:
  - templates/workload-cluster/cni-cilium.yaml
release:
  name: my-cluster
kubernetesProvider:
  scheme:
    helm.toolkit.fluxcd.io/v2/HelmRelease:
      gvr:
        group: helm.toolkit.fluxcd.io
        version: v2
        resource: helmreleases
      namespaced: true
tests:
  - it: wraps the HelmRelease in a ResourceSet when cni is cilium
    set:
      cni: cilium
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ResourceSet
      - equal:
          path: metadata.name
          value: my-cluster-cni
      - isNullOrEmpty:
          path: metadata.annotations
      - equal:
          path: spec.resources[0].kind
          value: HelmRelease
      - equal:
          path: spec.resources[0].metadata.name
          value: my-cluster-cni

  - it: sets the reconcile annotation on upgrade when the ResourceSet doesn't exist yet
    set:
      cni: cilium
    release:
      upgrade: true
    asserts:
      - equal:
          path: metadata.annotations["fluxcd.controlplane.io/reconcileEvery"]
          value: 1m

  - it: gates on Cluster ControlPlaneAvailable
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.dependsOn[0].apiVersion
          value: cluster.x-k8s.io/v1beta2
      - equal:
          path: spec.dependsOn[0].kind
          value: Cluster
      - equal:
          path: spec.dependsOn[0].name
          value: my-cluster
      - equal:
          path: spec.dependsOn[0].namespace
          value: NAMESPACE
      - equal:
          path: spec.dependsOn[0].ready
          value: true
      - matchRegex:
          path: spec.dependsOn[0].readyExpr
          pattern: ControlPlaneAvailable

  - it: interval is 10s when the HelmRelease does not exist yet
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.resources[0].spec.interval
          value: 10s

  - it: interval is 10s when the HelmRelease exists but is not ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-cni
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "False"
    asserts:
      - equal:
          path: spec.resources[0].spec.interval
          value: 10s

  - it: interval is 1h when the HelmRelease exists and is ready
    set:
      cni: cilium
    kubernetesProvider:
      objects:
        - apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: my-cluster-cni
            namespace: NAMESPACE
          status:
            conditions:
              - type: Ready
                status: "True"
    asserts:
      - equal:
          path: spec.resources[0].spec.interval
          value: 1h

  - it: no output when cni is calico
    set:
      cni: calico
    asserts:
      - hasDocuments:
          count: 0

  - it: omits the reconcile annotation when the ResourceSet already exists
    set:
      cni: cilium
    kubernetesProvider:
      scheme:
        fluxcd.controlplane.io/v1/ResourceSet:
          gvr:
            group: fluxcd.controlplane.io
            version: v1
            resource: resourcesets
          namespaced: true
      objects:
        - apiVersion: fluxcd.controlplane.io/v1
          kind: ResourceSet
          metadata:
            name: my-cluster-cni
            namespace: NAMESPACE
    asserts:
      - isNullOrEmpty:
          path: metadata.annotations

  - it: enables PodDisruptionBudgets for cilium-operator and hubble-ui
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.resources[0].spec.values.operator.podDisruptionBudget.enabled
          value: true
      - equal:
          path: spec.resources[0].spec.values.hubble.ui.podDisruptionBudget.enabled
          value: true

  - it: install and upgrade timeout default to 300s when there are no node pools
    set:
      cni: cilium
    asserts:
      - equal:
          path: spec.resources[0].spec.install.timeout
          value: 300s
      - equal:
          path: spec.resources[0].spec.upgrade.timeout
          value: 300s

  - it: install and upgrade timeout scale with the summed node pool sizes
    set:
      cni: cilium
      nodePools.workers.flavor: m1.medium
      nodePools.workers.replicas: 2
      nodePools.workers.maxReplicas: 5
      nodePools.gpu.flavor: m1.medium
      nodePools.gpu.replicas: 3
    asserts:
      - equal:
          path: spec.resources[0].spec.install.timeout
          value: 480s
      - equal:
          path: spec.resources[0].spec.upgrade.timeout
          value: 480s

