{{- $repoCharts := (index .Values.global.helmRepositories "cloud-provider-openstack").charts -}}
{{- $selectedVersion := default (index $repoCharts "openstack-cloud-controller-manager") (index $repoCharts (printf "openstack-cloud-controller-manager 2.%d.x" ($.Values.version.minor | int))) -}}
{{- $missingNodesDelete := eq (int (semver $selectedVersion).Minor) 36 -}}
{{- $name := printf "%s-ccm" .Release.Name -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace}}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  chart:
    spec:
      chart: openstack-cloud-controller-manager
      sourceRef:
        kind: HelmRepository
        name: cloud-provider-openstack
        namespace: flux-system
      version: {{ $selectedVersion | quote }}
  interval: {{ include "t8s-cluster.helm.dynamicInterval" (dict "name" $name "namespace" .Release.Namespace) }}
  driftDetection:
    mode: enabled
  {{- if eq (include "t8s-cluster.cni" .) "cilium" }}
  dependsOn:
    - name: {{ printf "%s-cni" .Release.Name }}
      namespace: {{ .Release.Namespace }}
  {{- end }}
  install:
    remediation:
      retries: -1
  uninstall:
    disableWait: true
  upgrade:
    timeout: 5m
  storageNamespace: kube-system
  targetNamespace: kube-system
  releaseName: ccm
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-kubeconfig
  valuesFrom:
    - &valuesFrom
      kind: Secret
      name: {{ .Release.Name }}-ccm-cloud-config
      optional: false
      targetPath: cloudConfigContents
      valuesKey: cloud.conf
    - <<: *valuesFrom
      targetPath: cloudConfig.metadata.hash
  postRenderers:
    - kustomize:
        patches:
          {{- if $missingNodesDelete }}
          # TODO: drop once a 2.36.x chart with https://github.com/kubernetes/cloud-provider-openstack/pull/3228 is released (fixed in 2.37.0); 2.36.2-2.36.5 lack the nodes delete verb
          - target:
              kind: ClusterRole
            patch: |
              - op: test
                path: /rules/2/resources/0
                value: nodes
              - op: add
                path: /rules/2/verbs/-
                value: delete
          {{- end }}
          # the chart has no value for it; must come before the DaemonSet is turned into a Deployment below
          - target:
              kind: DaemonSet
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/terminationMessagePolicy
                value: FallbackToLogsOnError
          {{- if .Values.controlPlane.hosted }}
          - target:
              kind: DaemonSet
            patch: |
              - op: replace
                path: /kind
                value: Deployment
              - op: remove
                path: /spec/template/spec/nodeSelector
              - op: move
                from: /spec/updateStrategy
                path: /spec/strategy
          {{- end }}
  values:
    priorityClassName: system-cluster-critical
    # CoreDNS can't schedule before the CCM removes the uninitialized taints (kubeadm) or may sit on a node that is still uninitialized (hosted), and a CCM that can't resolve the apiserver/Keystone never initializes the nodes
    dnsPolicy: Default
  {{- if .Values.controlPlane.hosted }}
    tolerations:
      - key: node.cluster.x-k8s.io/uninitialized
        effect: NoSchedule
      - key: node.cloudprovider.kubernetes.io/uninitialized
        value: "true"
        effect: NoSchedule
  {{- end }}
