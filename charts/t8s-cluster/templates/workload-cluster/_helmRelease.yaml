{{- define "t8s-cluster.helm._resourceIntoClusterBody" -}}
  {{- $_ := mustMerge . (pick .context "Values" "Release" "Chart") -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .fullName }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .additionalLabels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  chart:
    spec:
      chart: static
      version: 0.1.1
      sourceRef:
        kind: HelmRepository
        name: cetic
        namespace: flux-system
  interval: {{ include "t8s-cluster.helm.dynamicInterval" (dict "name" .fullName "namespace" .Release.Namespace) }}
  driftDetection:
    mode: enabled
  {{- with .dependsOn }}
  dependsOn: {{ toYaml . | nindent 4 }}
  {{- end }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-kubeconfig
  install:
    remediation:
      retries: -1
  uninstall:
    disableWait: true
  storageNamespace: kube-system
  targetNamespace: kube-system
  releaseName: {{ .name }}
  values:
    {{- if eq .render nil }}
    static: {{ toYaml .resource | indent 6 }}
    {{- else if .render }}
    static: {{ include "common.tplvalues.render" (dict "value" .resource "context" .context) | indent 6 }}
    {{- else }}
    static: {{ toYaml .resource | replace "{{" "{{ `{{` }}" | indent 6 }}
    {{- end }}
{{- end -}}

{{- define "t8s-cluster.helm.resourceIntoCluster" -}}
  {{- $_ := mustMerge . (pick .context "Values" "Release" "Chart") -}}
  {{- $fullName := printf "%s-%s" .Release.Name .name -}}
  {{- $bodyArgs := dict "context" .context "fullName" $fullName "name" .name "resource" .resource "additionalLabels" .additionalLabels "dependsOn" .dependsOn "render" .render -}}
  {{- if .waitForCluster }}
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if and .Release.IsUpgrade (not (lookup "fluxcd.controlplane.io/v1" "ResourceSet" .Release.Namespace $fullName)) }}
    fluxcd.controlplane.io/reconcileEvery: 1m
    {{- end }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .additionalLabels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  {{- include "t8s-cluster.resourceSet.dependsOnCluster" (dict "context" .context) | nindent 2 }}
  resources:
    - {{- include "t8s-cluster.helm._resourceIntoClusterBody" $bodyArgs | nindent 6 }}
  {{- else -}}
  {{- include "t8s-cluster.helm._resourceIntoClusterBody" $bodyArgs -}}
  {{- end }}
{{- end -}}
