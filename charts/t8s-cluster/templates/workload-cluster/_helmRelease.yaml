{{- define "t8s-cluster.helm.resourceIntoCluster" -}}
  {{- $_ := mustMerge . (pick .context "Values" "Release" "Chart") -}}
  {{- $name := printf "%s-%s" .Release.Name .name -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .additionalLabels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  chart:
    spec:
      chart: static
      version: 0.1.1
      sourceRef:
        kind: HelmRepository
        name: cetic
        namespace: flux-system
  interval: {{ include "t8s-cluster.helm.dynamicInterval" (dict "name" $name "namespace" .Release.Namespace) }}
  driftDetection:
    mode: enabled
  {{- with .dependsOn }}
  dependsOn: {{ toYaml . | nindent 4 }}
  {{- end }}
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-kubeconfig
  install:
    remediation:
      retries: -1
  uninstall:
    disableWait: true
  storageNamespace: kube-system
  targetNamespace: kube-system
  releaseName: {{ .name }}
  values:
    {{- if eq .render nil }}
    static: {{ toYaml .resource | indent 6 }}
    {{- else if .render }}
    static: {{ include "common.tplvalues.render" (dict "value" .resource "context" .context) | indent 6 }}
    {{- else }}
    static: {{ toYaml .resource | replace "{{" "{{ `{{` }}" | indent 6 }}
    {{- end }}
{{- end -}}
