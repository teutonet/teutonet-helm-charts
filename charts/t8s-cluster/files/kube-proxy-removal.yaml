{{- /*
Evaluated by the `static` chart inside the workload cluster (via tpl), not by t8s-cluster, so `lookup` sees the workload cluster.
Everything is a post-install/post-upgrade Helm hook that is deleted again once all hooks succeeded, so nothing stays behind.
Renders nothing if there is no kube-proxy DaemonSet (anymore).
Helm only waits for Jobs, so the per-node work is one Job per node instead of a DaemonSet.
Leaves the cluster like one that skipped the kube-proxy addon at init: everything kubeadm installs for kube-proxy is deleted
and the kubeadm-config ConfigMap says `proxy.disabled`, so no kubeadm run brings it back.

The kube-proxy DaemonSet is what marks the migration as pending, so it is deleted last. A failed or timed out run (e.g. a node
that is NotReady) is retried by the HelmRelease and renders everything again, nothing is skipped:
  weight -10  RBAC
  weight  -5  stop kube-proxy (DaemonSet nodeSelector matches nothing, the object stays)
  weight   0  one Job per node: wait for its kube-proxy pod to be gone, flush its rules (a NotReady node's Job stays pending)
  weight  10  delete everything kube-proxy related, set proxy.disabled
*/ -}}
{{- $kubeProxy := lookup "apps/v1" "DaemonSet" "kube-system" "kube-proxy" -}}
{{- if $kubeProxy }}
{{- $kubeProxyImage := (index $kubeProxy.spec.template.spec.containers 0).image }}
{{- /* rendered here from the current ClusterConfiguration, as the kubectl image has no shell to edit it */ -}}
{{- $disableProxyPatch := "" }}
{{- with (lookup "v1" "ConfigMap" "kube-system" "kubeadm-config") }}
  {{- $clusterConfiguration := get .data "ClusterConfiguration" | fromYaml }}
  {{- if not (dig "proxy" "disabled" false $clusterConfiguration) }}
    {{- $disableProxyPatch = dict "data" (dict "ClusterConfiguration" (set $clusterConfiguration "proxy" (dict "disabled" true) | toYaml)) | toJson }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-proxy-removal
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-proxy-removal
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - apps
    resources:
      - daemonsets
    resourceNames:
      - kube-proxy
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
      - serviceaccounts
    resourceNames:
      - kube-proxy
    verbs:
      - get
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    resourceNames:
      - kube-proxy
    verbs:
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-proxy-removal
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-proxy-removal
subjects:
  - kind: ServiceAccount
    name: kube-proxy-removal
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-proxy-removal
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    resourceNames:
      - kubeadm:node-proxier
    verbs:
      - get
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-proxy-removal
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-proxy-removal
subjects:
  - kind: ServiceAccount
    name: kube-proxy-removal
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-proxy-removal-stop
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kube-proxy-removal
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: stop-kube-proxy
          image: __KUBECTL_IMAGE__
          args:
            - patch
            - daemonset
            - kube-proxy
            - --namespace=kube-system
            - --type=merge
            - '--patch={"spec":{"template":{"spec":{"nodeSelector":{"kube-proxy-removal":"stopped"}}}}}'
{{- range $index, $node := (lookup "v1" "Node" "" "").items }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-proxy-removal-{{ $index }}
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kube-proxy-removal
      hostNetwork: true
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/hostname: {{ index $node.metadata.labels "kubernetes.io/hostname" | quote }}
      tolerations:
        - operator: Exists
      initContainers:
        # kube-proxy keeps re-adding its rules until its pod on this node is gone
        - name: wait-for-kube-proxy-pod
          image: __KUBECTL_IMAGE__
          args:
            - wait
            - pod
            - --namespace=kube-system
            - --selector=k8s-app=kube-proxy
            - --field-selector=spec.nodeName={{ $node.metadata.name }}
            - --for=delete
            - --timeout=10m
      containers:
        - name: cleanup-rules
          image: {{ $kubeProxyImage | quote }}
          command:
            - kube-proxy
            - --cleanup
          securityContext:
            privileged: true
            runAsUser: 0
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-proxy-removal-finish
  namespace: kube-system
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kube-proxy-removal
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
{{- if $disableProxyPatch }}
      initContainers:
        - name: mark-proxy-disabled
          image: __KUBECTL_IMAGE__
          args:
            - patch
            - configmap
            - kubeadm-config
            - --namespace=kube-system
            - --type=merge
            - {{ printf "--patch=%s" $disableProxyPatch | quote }}
{{- end }}
      containers:
        # the DaemonSet is the last one on purpose, as it is what keeps the whole removal rendered when this fails halfway
        - name: delete-kube-proxy
          image: __KUBECTL_IMAGE__
          args:
            - delete
            - configmap/kube-proxy
            - serviceaccount/kube-proxy
            - role/kube-proxy
            - rolebinding/kube-proxy
            - clusterrolebinding/kubeadm:node-proxier
            - daemonset/kube-proxy
            - --namespace=kube-system
            - --ignore-not-found
            - --wait=false
{{- end }}
