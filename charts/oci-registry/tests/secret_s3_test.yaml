suite: s3 secret deployment gating
templates:
  - templates/secret-s3.yaml
release:
  name: oci-registry
tests:
  - it: is not rendered in filesystem storage mode
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when s3 mode has no credentials and no existing secret name
    set:
      registry.storage.mode: s3
    asserts:
      - failedTemplate:
          errorMessage: "registry.storage.s3.authSecret.accessKey is required when registry.storage.s3.authSecret.name is not set"

  - it: deploys the s3 secret when credentials are given
    set:
      registry.storage.mode: s3
      registry.storage.s3.authSecret.accessKey: key
      registry.storage.s3.authSecret.secretKey: secret
    asserts:
      - hasDocuments:
          count: 1

  - it: skips the s3 secret when an existing secret name is given, even in s3 mode
    set:
      registry.storage.mode: s3
      registry.storage.s3.authSecret.name: existing-s3-secret
    asserts:
      - hasDocuments:
          count: 0
