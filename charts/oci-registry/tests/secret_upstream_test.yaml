suite: upstream secret content resolution
templates:
  - templates/secret-upstream.yaml
release:
  name: oci-registry
  namespace: oci-registry
tests:
  - it: always deploys the upstream secret
    asserts:
      - hasDocuments:
          count: 1

  - it: renders contents into the upstream secret
    set:
      registry.upstream.config.contents:
        - namespace: docker.io
          host: registry-1.docker.io
          username: myuser
          password: mypass
    asserts:
      - equal:
          path: data["upstream.yaml"]
          value: LSBob3N0OiByZWdpc3RyeS0xLmRvY2tlci5pbwogIG5hbWVzcGFjZTogZG9ja2VyLmlvCiAgcGFzc3dvcmQ6IG15cGFzcwogIHVzZXJuYW1lOiBteXVzZXI=
