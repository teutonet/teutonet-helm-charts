apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oci-registry.upstreamSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "common.labels.standard" $ | nindent 4 }}
type: Opaque
data:
  upstream.yaml: {{ .Values.registry.upstream.config.contents | toYaml | b64enc }}
