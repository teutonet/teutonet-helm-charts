global:
  imagePullSecrets: []
  networkPolicy:
    dnsLabels:
      io.kubernetes.pod.namespace: kube-system
      k8s-app: kube-dns
  podSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
    runAsGroup: 1000
    runAsUser: 1000

  securityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroupChangePolicy: OnRootMismatch

worker:
  config:
    loggingFormat: json
  image:
    registry: registry-gitlab.teuto.net
    repository: 4teuto/dev/teuto-portal/teuto-portal-k8s-worker/teuto-portal-k8s-worker
    tag: 4.6.0@sha256:9aec09c5f2e65c3208535ab1653b25c69a2c409d45d6e1a62cbd8688ad913bb2
  database:
    credentials:
      secret:
        name: ""
    host: localhost
    port: 5432
  kubeconfig:
    secret:
      name: ""
  resourcesPreset: micro
  resources:
    limits:
      memory: 1Gi
